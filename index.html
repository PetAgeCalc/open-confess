    <!-- Custom Post Layout & Styling -->
    <style>
      /* Center Alignment & Responsive Viewport Fix */
      html, body, #root {
        width: 100% !important;
        overflow-x: hidden !important;
      }

      main, .max-w-2xl {
        margin-left: auto !important;
        margin-right: auto !important;
        padding-left: 14px !important;
        padding-right: 14px !important;
        max-width: 480px !important;
        width: 100% !important;
        box-sizing: border-box !important;
      }

      /* Post Card Container: Pure White Card in True Center */
      div[class*="rounded-2xl"]:has(img) {
        background-color: #ffffff !important;
        border: 1px solid #e2e8f0 !important;
        border-radius: 18px !important;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25) !important;
        padding: 16px !important;
        margin: 18px auto !important;
        width: 100% !important;
        box-sizing: border-box !important;
        display: flex !important;
        flex-direction: column !important;
      }

      /* Hero Size Big Image at Top */
      div[class*="rounded-2xl"]:has(img) div:has(> img),
      div[class*="rounded-2xl"]:has(img) .flex-shrink-0 {
        width: 100% !important;
        max-width: 100% !important;
        height: 210px !important;
        min-height: 210px !important;
        border-radius: 12px !important;
        overflow: hidden !important;
        margin-bottom: 12px !important;
        flex: none !important;
      }

      div[class*="rounded-2xl"]:has(img) img {
        width: 100% !important;
        height: 100% !important;
        min-width: 100% !important;
        min-height: 100% !important;
        object-fit: cover !important;
        display: block !important;
      }

      /* Text Visibility Fix: Pure Dark Charcoal Black */
      div[class*="rounded-2xl"]:has(img) * {
        color: #0f172a !important;
      }

      /* Confession Body Text: 2 to 3 lines clamp */
      div[class*="rounded-2xl"]:has(img) p,
      div[class*="rounded-2xl"]:has(img) .line-clamp-4 {
        color: #0f172a !important;
        font-size: 1.05rem !important;
        font-weight: 500 !important;
        line-height: 1.55 !important;
        display: -webkit-box !important;
        -webkit-line-clamp: 3 !important;
        -webkit-box-orient: vertical !important;
        overflow: hidden !important;
        margin: 6px 0 12px 0 !important;
      }

      /* Location Tag, Reactions & Bottom Row */
      div[class*="rounded-2xl"]:has(img) span,
      div[class*="rounded-2xl"]:has(img) [class*="text-xs"] {
        color: #64748b !important;
      }

      div[class*="rounded-2xl"]:has(img) button,
      div[class*="rounded-2xl"]:has(img) div:last-child {
        color: #334155 !important;
      }

      div[class*="rounded-2xl"]:has(img) div:last-child:has(button) {
        border-top: 1px solid #f1f5f9 !important;
        padding-top: 10px !important;
        margin-top: 4px !important;
      }
    </style>
